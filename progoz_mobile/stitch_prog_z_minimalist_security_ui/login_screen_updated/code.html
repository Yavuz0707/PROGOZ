<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PROGÖZ - Giriş</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "secondary": "#c9c6c5",

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=JetBrains+Mono:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #000000;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Staggered Animation */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fade-up {
            opacity: 0;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        
        /* Input Autofill Override for Dark Theme */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #0d0d0d inset !important;
            -webkit-text-fill-color: #ffffff !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-primary font-body-md selection:bg-surface-container-high selection:text-primary">
<main class="w-full max-w-[480px] px-8 flex flex-col items-stretch gap-12 justify-center">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-4 animate-fade-up">
<span class="material-symbols-outlined text-primary mb-2" data-icon="security" style="font-size: 80px; font-variation-settings: 'FILL' 1, 'wght' 200;">security</span>
<h1 class="font-display-lg text-[64px] leading-[1.1] font-bold text-primary tracking-tighter">PROGÖZ</h1>
<p class="font-label-md text-[16px] text-on-surface-variant font-light tracking-widest uppercase mt-2">Güvenlik Sistemine Giriş</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-6 w-full" onsubmit="event.preventDefault();">
<!-- Username Input -->
<div class="relative group animate-fade-up delay-100">
<div class="absolute inset-y-0 left-0 flex items-center pl-5 pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]" data-icon="person">person</span>
</div>
<input class="w-full h-16 bg-[#0d0d0d] border border-[#2a2a2a] text-primary font-body-md text-[18px] rounded-xl pl-14 pr-5 focus:outline-none focus:border-primary focus:ring-0 transition-colors placeholder:text-on-surface-variant" id="username" placeholder="Kullanıcı Adı" required="" type="text"/>
</div>
<!-- Password Input -->
<div class="relative group animate-fade-up delay-200">
<div class="absolute inset-y-0 left-0 flex items-center pl-5 pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]" data-icon="lock">lock</span>
</div>
<input class="w-full h-16 bg-[#0d0d0d] border border-[#2a2a2a] text-primary font-body-md text-[18px] rounded-xl pl-14 pr-14 focus:outline-none focus:border-primary focus:ring-0 transition-colors placeholder:text-on-surface-variant" id="password" placeholder="Şifre" required="" type="password"/>
<button aria-label="Şifreyi Göster/Gizle" class="absolute inset-y-0 right-0 flex items-center pr-5 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Spacer -->
<div class="h-2"></div>
<!-- Submit Button -->
<button class="animate-fade-up delay-300 w-full h-16 bg-primary text-[#000000] font-headline-md text-[20px] font-bold rounded-xl hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-3" type="submit">
                Giriş Yap
                <span class="material-symbols-outlined text-[#000000] text-[24px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer / Helper -->
<div class="animate-fade-up delay-400 text-center mt-6">
<p class="font-label-sm text-label-md text-on-surface-variant">Sistem yetkisi olmayan girişler kayıt altına alınmaktadır.</p>
</div>
</main>
<script>
        // Password Visibility Toggle Logic
        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const iconSpan = toggleButton.querySelector('.material-symbols-outlined');

            toggleButton.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                if (type === 'text') {
                    iconSpan.textContent = 'visibility_off';
                    iconSpan.setAttribute('data-icon', 'visibility_off');
                } else {
                    iconSpan.textContent = 'visibility';
                    iconSpan.setAttribute('data-icon', 'visibility');
                }
            });
        });
    </script>
</body></html>
