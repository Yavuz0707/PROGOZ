<style>
        .hero-enter {
            animation: slideUpFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        @keyframes slideUpFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-md min-h-screen selection:bg-surface-variant selection:text-primary">
<!-- Header (Task-Focused: Supressing Global Nav) -->
<header class="w-full top-0 sticky bg-background border-b border-outline-variant flex justify-between items-center px-container-padding-mobile md:px-container-padding-desktop h-16 z-50">
<button aria-label="Geri" class="text-on-surface-variant hover:text-primary transition-opacity duration-200 flex items-center justify-center p-2 -ml-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary absolute left-1/2 -translate-x-1/2">Olay Detayı</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<main class="max-w-3xl mx-auto px-container-padding-mobile md:px-container-padding-desktop py-stack-gap md:py-section-gap space-y-section-gap pb-32">
<!-- Hero Section -->
<section class="flex flex-col items-center justify-center text-center space-y-4 hero-enter">
<!-- Status Badge (No Glow, Colored Ring) -->
<div class="w-24 h-24 rounded-full border-4 border-error flex items-center justify-center bg-background">
<span class="material-symbols-outlined text-error !text-5xl" data-icon="warning" style="font-variation-settings: 'FILL' 0;">warning</span>
</div>
<div class="space-y-1">
<h2 class="font-headline-lg text-headline-lg text-primary">Kamera 04 - Ön Kapı</h2>
<p class="font-body-md text-body-md text-on-surface-variant">24 Ekim 2023 • 14:32:05</p>
</div>
</section>
<!-- Image Snapshot -->
<section class="relative w-full aspect-video rounded-xl overflow-hidden border border-outline-variant hero-enter delay-100 bg-[#161616]">
<img alt="Güvenlik kamerası görüntüsü" class="w-full h-full object-cover" data-alt="A high-contrast security camera feed showing a desolate urban loading dock at night. The scene is illuminated by harsh, cold industrial lighting creating deep, true black shadows (#000000) and stark highlights. The aesthetic is strictly utilitarian and serious, with a monochromatic dark mode atmosphere. A subtle, sharp focus is on a distant metallic door. The overall mood is tense and authoritative, fitting a high-stakes security monitoring system." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDcPGnh96EPz_U8nPmJ7ZA5FR6GN0rWR6uNcfzxQGGo0cPuUpcIoAM-jiiGguIPMLZhgFkf7zMmK76BYYcyQgyFVuMxsvlK6AWwJ2A-AuUPf3PM_QONqIw1F3h7c6fzE8fSghWrAn-ZqGyUe31ZgE3BjAy9UILXmP-BJwwm5ah9kU4aXZLRuhOwIMdEjeVbgRBbWYmoz-FsmIsaKS-v6_v_2OFJgZ-vrOI52tMB6gl8mtJXDM2S4rNqzFir2XcSlRpHBCuMnkAXg1g"/>
<!-- Dark Gradient Overlay for Readability -->
<div class="absolute inset-0 bg-gradient-to-b from-black/80 via-transparent to-transparent pointer-events-none"></div>
<!-- Snapshot Status Badge -->
<div class="absolute top-4 left-4 bg-error text-background font-label-sm text-label-sm px-3 py-1 rounded-full flex items-center space-x-1 uppercase tracking-wider">
<span class="material-symbols-outlined !text-[14px]" data-icon="error">error</span>
<span>İhlal Tespit Edildi</span>
</div>
</section>
<!-- Stats Grid -->
<section class="grid grid-cols-2 gap-gutter hero-enter delay-200">
<!-- Stat Card 1 -->
<div class="bg-[#161616] border border-[#2a2a2a] rounded-lg p-4 flex flex-col justify-between">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-2">Başlangıç</span>
<span class="font-headline-sm text-headline-sm text-primary">14:32:05</span>
</div>
<!-- Stat Card 2 -->
<div class="bg-[#161616] border border-[#2a2a2a] rounded-lg p-4 flex flex-col justify-between">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-2">Bitiş</span>
<span class="font-headline-sm text-headline-sm text-primary">14:32:45</span>
</div>
<!-- Stat Card 3 -->
<div class="bg-[#161616] border border-[#2a2a2a] rounded-lg p-4 flex flex-col justify-between">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-2">Süre</span>
<span class="font-headline-sm text-headline-sm text-primary">40s</span>
</div>
<!-- Stat Card 4 -->
<div class="bg-[#161616] border border-[#2a2a2a] rounded-lg p-4 flex flex-col justify-between">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-2">Maks. Skor</span>
<div class="flex items-end space-x-1">
<span class="font-headline-sm text-headline-sm text-error">98%</span>
<span class="material-symbols-outlined text-error !text-[20px] mb-1" data-icon="trending_up">trending_up</span>
</div>
</div>
</section>
<!-- Action Buttons (Fixed at bottom on mobile, relative on desktop) -->
<section class="fixed bottom-0 left-0 w-full p-container-padding-mobile bg-background/90 border-t border-[#2a2a2a] md:relative md:bg-transparent md:border-0 md:p-0 flex flex-col sm:flex-row gap-stack-gap z-40 hero-enter delay-300">
<button class="flex-1 py-3 px-6 rounded border border-outline text-primary font-label-md text-label-md uppercase tracking-wider hover:bg-surface-container-high transition-colors flex items-center justify-center space-x-2 bg-transparent">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
<span>Doğru Olay</span>
</button>
<button class="flex-1 py-3 px-6 rounded border border-error text-error font-label-md text-label-md uppercase tracking-wider hover:bg-error/10 transition-colors flex items-center justify-center space-x-2 bg-transparent">
<span class="material-symbols-outlined" data-icon="cancel">cancel</span>
<span>Yanlış Alarm</span>
</button>
</section>
</main>
</body></html>
