<style>
        .animate-fade-scale {
            animation: fadeScale 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(0.95);
        }
        
        .animate-fade-up {
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        
        .delay-100 {
            animation-delay: 100ms;
        }
        
        .delay-300 {
            animation-delay: 300ms;
        }
        
        .delay-500 {
            animation-delay: 500ms;
        }

        @keyframes fadeScale {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-line {
            width: 0%;
            height: 2px;
            background-color: #ffffff;
            animation: load 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            animation-delay: 800ms;
        }

        @keyframes load {
            0% { width: 0%; opacity: 0; }
            10% { opacity: 1; }
            100% { width: 100%; opacity: 1; }
        }
    </style>
<style>

<body class="bg-[#000000] text-primary h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative font-body-md">
<!-- Main Content Canvas (Navigation Suppressed for Splash Screen) -->

<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 0, 'wght' 200;">
                    security
                </span>
</div>
<!-- Wordmark -->
<h1 class="animate-fade-scale delay-300 font-display-lg text-display-lg font-bold tracking-[0.2em] text-primary uppercase select-none">
                PROGÖZ
            </h1>
<!-- Subtitle -->
<h2 class="animate-fade-up delay-500 font-label-sm text-label-sm tracking-[0.25em] text-on-surface-variant uppercase select-none">
                PROAKTİF GÖZETİM SİSTEMİ
            </h2>
</div>
</main>
<!-- Bottom Loading Bar Area -->
<div class="absolute bottom-16 left-0 right-0 w-full flex justify-center px-8 md:px-32 opacity-0 animate-fade-up delay-500">
<div class="w-full max-w-md h-[1px] bg-surface-container-high relative overflow-hidden">
<!-- The pure CSS loading line as fallback, but if we had a shader it would go here -->
<div class="loading-line absolute top-0 left-0 h-full"></div>
<!-- Optional: WebGL Shader for pulse effect if requested, embedded per rules -->
<!-- <webgl-shader src="{{DATA:ANIMATION:ANIMATION_1}}" class="absolute inset-0 w-full h-full opacity-50"></webgl-shader> -->
</div>
</div>
